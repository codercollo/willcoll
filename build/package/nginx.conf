# SPA fallback + immutable asset caching for the web prod image. Mirrors
# build/Caddyfile's try_files behavior (nuxt.config.ts's static preset emits
# 200.html as the SPA-fallback shell) — this is what nginx itself serves
# when reached directly, e.g. in dev/staging without Caddy in front.
server {
    listen 80;
    server_name _;
    root /srv/web;

    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /200.html;
    }
}
