name: deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Everything actually happens on the VPS: scripts/deploy.sh does its
      # own git pull, image build, migrate, and restart (Phase 7.2) — this
      # workflow's only job is getting onto the box and running it.
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.CONTABO_APP_DIR }}
            bash scripts/deploy.sh
