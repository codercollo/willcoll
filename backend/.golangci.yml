# golangci-lint v2 (https://golangci-lint.run). `make audit` runs it after
# go vet and staticcheck. Kept to linters that find real bugs in this codebase
# (unchecked errors, leaked response bodies, mishandled wrapped errors,
# unclosed rows); style is left to gofmt.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck      # an ignored error on a money path is a lost payment
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose     # payhero / sms clients: every response body is closed
    - rowserrcheck  # sql.Rows.Err() is checked after iteration
    - sqlclosecheck # rows and statements are closed
    - errorlint     # errors.Is / errors.As, never == or a type switch on wrapped errors
    - misspell
    - depguard      # internal/shared must stay product-agnostic: see below
  settings:
    errcheck:
      check-type-assertions: true
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    depguard:
      rules:
        shared:
          # internal/shared/* is imported by every product's binary
          # (rentals-api today, estates-api/waste-api later); if it
          # imports a product package, that product becomes an implicit
          # dependency of every other product. TestSharedDoesNotImportRentals
          # (internal/shared/depguard_test.go) enforces the same rule via
          # `go list -deps`, so it still fails in a `go test` run with no
          # golangci-lint installed.
          files:
            - "internal/shared/**/*.go"
          deny:
            - pkg: github.com/codercollo/willcoll/backend/internal/rentals
              desc: internal/shared may not import internal/rentals (or any of its subpackages)
            - pkg: github.com/codercollo/willcoll/backend/internal/estates
              desc: internal/shared may not import internal/estates (or any of its subpackages)
            - pkg: github.com/codercollo/willcoll/backend/internal/waste
              desc: internal/shared may not import internal/waste (or any of its subpackages)
        platform:
          # internal/platform is imported by every product API for
          # identity/billing; if it imported a product package, that
          # product would become an implicit dependency of every other
          # product through the platform layer (project-structure.txt Part
          # D). TestPlatformOnlyImportsShared
          # (internal/platform/depguard_test.go) enforces the same rule via
          # `go list -deps`.
          files:
            - "internal/platform/**/*.go"
          deny:
            - pkg: github.com/codercollo/willcoll/backend/internal/rentals
              desc: internal/platform may not import internal/rentals (or any of its subpackages) — platform imports shared only
            - pkg: github.com/codercollo/willcoll/backend/internal/estates
              desc: internal/platform may not import internal/estates (or any of its subpackages) — platform imports shared only
            - pkg: github.com/codercollo/willcoll/backend/internal/waste
              desc: internal/platform may not import internal/waste (or any of its subpackages) — platform imports shared only
  exclusions:
    generated: lax
    paths:
      - internal/rentals/db/sqlc
      - internal/rentals/db/mock
      - internal/platform/db/sqlc
      - internal/platform/db/mock
    rules:
      # Tests may drop the error from cleanup calls (Close, best-effort DELETE).
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - internal/rentals/db/sqlc
      - internal/rentals/db/mock
      - internal/platform/db/sqlc
      - internal/platform/db/mock
